<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sideline Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen tool. Top bar, then library | field | details. Stacks on phones. */
:root {
  --bg: #e9eeeb;
  --panel: #ffffff;
  --ink: #17201b;
  --muted: #5a675f;
  --line: #d3dbd6;
  --chip: #f1f5f2;
  --accent: #d9480f;
  --accent-ink: #ffffff;
  --focus: #1c7ed6;
  --danger: #c92a2a;
  --canvas: #23302a;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --panel: #1a211d; --ink: #e5ebe7; --muted: #97a59d; --line: #2c3631;
    --chip: #222b26; --accent: #ff7333; --accent-ink: #1a0a02; --focus: #4dabf7; --danger: #ff6b6b; --canvas: #1b2621;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --panel: #1a211d; --ink: #e5ebe7; --muted: #97a59d; --line: #2c3631;
  --chip: #222b26; --accent: #ff7333; --accent-ink: #1a0a02; --focus: #4dabf7; --danger: #ff6b6b; --canvas: #1b2621;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }

/* Top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; margin-right: 4px; }
.name { min-width: 0; width: 230px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-weight: 600; }
.dirty { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.grp { display: flex; align-items: center; gap: 6px; position: relative; }
.btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.sel { padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 7px 11px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.spacer { flex: 1; }

.pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: 320px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; display: grid; gap: 2px; max-height: 70vh; overflow: auto; }
.pop-row { text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; }
.pop-row:hover { background: var(--chip); }
.pop-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 10px 4px; }
.pop-item { display: flex; gap: 4px; align-items: stretch; }
.pop-item .pop-row { flex: 1; min-width: 0; }
.pop-item small { display: block; color: var(--muted); font-size: 12px; }
.pop-item .x { border: 0; background: transparent; color: var(--muted); padding: 0 10px; border-radius: 6px; font-size: 12px; }
.pop-item .x:hover { color: var(--danger); background: var(--chip); }
.pop-note { font-size: 12px; color: var(--muted); padding: 8px 10px; }
.warn { color: var(--danger); font-weight: 600; }

/* Main */
.main { display: grid; grid-template-columns: 176px minmax(0, 1fr) 292px; gap: 10px; min-height: 0; }
.lib, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; min-height: 0; }
.lib { padding: 10px; display: flex; flex-direction: column; gap: 12px; }
.lib-group { display: grid; gap: 4px; }
.lib-h, .p-h { font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lib-btn { display: flex; align-items: center; gap: 8px; text-align: left; padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; background: var(--chip); touch-action: none; user-select: none; }
.lib-btn:hover { border-color: var(--line); }
.lib-btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.35); }
.sw.round { border-radius: 50%; }
.lib-tip { font-size: 12px; color: var(--muted); line-height: 1.4; }

.stage { position: relative; min-height: 0; border-radius: 8px; overflow: hidden; background: var(--canvas); }
.stage svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
.stage.connecting svg { cursor: crosshair; }
.views { position: absolute; top: 10px; left: 10px; z-index: 2; max-width: calc(100% - 20px); overflow-x: auto; }
.hint { position: absolute; top: 54px; left: 10px; right: 10px; pointer-events: none; display: flex; }
.hint span { background: rgba(10,16,12,.82); color: #f1f5f2; padding: 6px 10px; border-radius: 6px; font-size: 13px; max-width: 100%; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { min-width: 36px; height: 34px; border-radius: 6px; border: 1px solid rgba(255,255,255,.2); background: rgba(10,16,12,.82); color: #f1f5f2; font-weight: 600; }
.toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: #f8f9fa; color: #111; padding: 8px 14px; border-radius: 6px; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: calc(100% - 120px); text-align: center; }

.panel { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.p-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.1; text-wrap: balance; display: flex; align-items: center; gap: 8px; }
.p-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.f { display: grid; gap: 4px; }
.f label { font-size: 12px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.f textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
.f .help { font-size: 12px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.btn.danger { color: var(--danger); }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-variant-numeric: tabular-nums; }
.stat div:nth-child(even) { text-align: right; font-weight: 600; }
.empty { color: var(--muted); font-size: 13px; }
.notes-list { display: grid; gap: 6px; }
.note-btn { display: grid; grid-template-columns: 22px 1fr; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 8px; }
.note-btn b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #ffd43b; color: #111; font-size: 12px; }
.note-btn span { min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
.note-btn small { display: block; color: var(--muted); }
.conn-list { display: grid; gap: 4px; }
.conn-btn { display: flex; gap: 8px; align-items: center; text-align: left; border: 0; background: var(--chip); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.conn-btn i { width: 18px; height: 4px; border-radius: 2px; flex: none; }
.legend { display: grid; gap: 6px; font-size: 13px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend svg { flex: none; }
.how { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); font-size: 13px; line-height: 1.4; }

.ghost { position: fixed; z-index: 50; pointer-events: none; padding: 6px 10px; border-radius: 6px; background: var(--ink); color: var(--panel); font-weight: 600; transform: translate(-50%, -130%); }
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 20px; }
.overlay-card { background: var(--panel); border-radius: 10px; padding: 14px; max-width: min(1100px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 10px; }
.overlay-card img { width: 100%; height: auto; border-radius: 6px; }

@media (max-width: 1150px) { .main { grid-template-columns: 152px minmax(0, 1fr) 260px; } }
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-rows: auto auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .lib { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 14px; }
  .lib-group { grid-auto-flow: column; grid-template-rows: auto auto; align-content: start; }
  .lib-group .lib-h { grid-row: 1; }
  .lib-tip { display: none; }
  .stage { height: 64vh; min-height: 360px; }
  .name { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .lib-btn, .pop-row { transition: border-color .12s, background-color .12s; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">Sideline Planner</div>
    <input id="layout-name" class="name" aria-label="Layout name" placeholder="Layout name">
    <span id="dirty" class="dirty" hidden>Unsaved</span>
    <div class="grp">
      <button id="btn-layouts" class="btn" aria-haspopup="true" aria-expanded="false">Layouts ▾</button>
      <div id="layouts-pop" class="pop" hidden></div>
      <button id="btn-save" class="btn primary">Save</button>
    </div>
    <div class="grp">
      <button id="btn-undo" class="btn" title="Undo (Ctrl+Z)">Undo</button>
      <button id="btn-redo" class="btn" title="Redo (Ctrl+Shift+Z)">Redo</button>
    </div>
    <div class="grp">
      <button id="btn-connect" class="btn" aria-pressed="false" title="Draw a hose or cord between two items (C)">Draw hose / cord</button>
      <select id="conn-kind" class="sel" aria-label="Connection type"></select>
    </div>
    <div class="spacer"></div>
    <button id="btn-export" class="btn">Export image</button>
  </header>

  <div class="main">
    <aside class="lib" id="lib" aria-label="Equipment library"></aside>
    <section class="stage" id="stage">
      <div class="seg views" id="view-seg" role="group" aria-label="Which sideline to show"></div>
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Football field layout"><g id="scene"></g></svg>
      <div class="hint" id="hint" hidden><span id="hint-text"></span></div>
      <div class="zoom">
        <button id="z-out" aria-label="Zoom out">−</button>
        <button id="z-in" aria-label="Zoom in">+</button>
        <button id="z-fit">Fit</button>
      </div>
      <div class="toast" id="toast" hidden></div>
    </section>
    <aside class="panel" id="panel" aria-label="Details"></aside>
  </div>
</div>
<div class="ghost" id="ghost" hidden></div>
<div class="overlay" id="img-overlay" hidden>
  <div class="overlay-card">
    <div class="acts" style="justify-content:space-between;align-items:center">
      <strong>Right-click or long-press the image to save it.</strong>
      <button class="btn" id="img-close">Close</button>
    </div>
    <img id="img-out" alt="Exported sideline layout">
  </div>
</div>

<script>
(() => {
"use strict";
// ---------- Constants (all distances in feet; x = 0 at left goal line) ----------
const CUT_L = 75, CUT_R = 225;          // 25-yard lines
const FIELD_W = 160;                     // sideline to sideline
const SVG_FONT = "Barlow Condensed, Arial Narrow, Arial, sans-serif";
const SELC = "#74c0fc";

const CATS = {
  heat:   { fill: "#e8590c", stroke: "#7a2700", text: "#ffffff" },
  cool:   { fill: "#1971c2", stroke: "#0a3a66", text: "#ffffff" },
  power:  { fill: "#f2b705", stroke: "#6e5200", text: "#1b1b1b" },
  gas:    { fill: "#a61e2d", stroke: "#4f0d15", text: "#ffffff" },
  seat:   { fill: "#1f2326", stroke: "#000000", text: "#ffffff" },
  fit:    { fill: "#f1f3f5", stroke: "#212529", text: "#1b1b1b" },
  team:   { fill: "#8d969e", stroke: "#3b4146", text: "#ffffff" },
  custom: { fill: "#6741d9", stroke: "#2c176f", text: "#ffffff" },
  text:   { fill: "none",    stroke: "none",    text: "#ffffff" }
};
const TYPES = {
  ds170:      { name: "DS-170", w: 3, h: 3, cat: "heat" },
  ds350:      { name: "DS-350", w: 4, h: 4, cat: "heat" },
  modheat:    { name: "Modulating Heater", short: "Mod Heater", w: 4, h: 3, cat: "heat" },
  ac:         { name: "AC Cooling", w: 4, h: 6, cat: "cool" },
  compressor: { name: "Compressor", w: 4, h: 4, cat: "cool" },
  powerbox:   { name: "Power Box", w: 2.5, h: 2.5, cat: "power" },
  tower:      { name: "Cooling Tower", w: 6, h: 6, cat: "cool" },
  gasbank:    { name: "Gas Bank", w: 8, h: 4, cat: "gas" },
  threeway:   { name: "3-Way", w: 1.6, h: 1.6, cat: "fit", circle: true },
  bench:      { name: "Dragon Seat Bench", short: "Dragon Seat", w: 12, h: 3, cat: "seat", lockW: true },
  team:       { name: "Team Equipment", w: 10, h: 5, cat: "team" },
  custom:     { name: "Custom Item", w: 4, h: 4, cat: "custom" },
  text:       { name: "Text Label", short: "Label", w: 12, h: 2.5, cat: "text" }
};
const LIB = [
  ["Heat", ["ds170", "ds350", "modheat"]],
  ["Cooling", ["ac", "compressor", "powerbox", "tower"]],
  ["Gas", ["gasbank", "threeway"]],
  ["Seating", ["bench"]],
  ["Team & other", ["team", "custom", "text"]]
];
const KINDS = {
  gas:   { name: "Gas hose",       color: "#ff6a3d", w: 0.8, dash: "" },
  power: { name: "Extension cord", color: "#ffd43b", w: 0.6, dash: "1.6 0.9" },
  water: { name: "Water line",     color: "#4dabf7", w: 0.8, dash: "" },
  other: { name: "Other",          color: "#f1f3f5", w: 0.5, dash: "0.5 0.7" }
};

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const r2 = n => Math.round(n * 100) / 100;
const clampX = x => Math.min(CUT_R, Math.max(CUT_L, x));
const snap = (v, free) => free ? r2(v) : Math.round(v * 2) / 2;
const deep = o => JSON.parse(JSON.stringify(o));
const fmtYd = x => {
  const yd = x / 3, near = yd <= 50 ? yd : 100 - yd, r = Math.round(near);
  if (r === 50) return "At the 50";
  return `${r}-yard line, ${yd < 50 ? "left" : "right"} of the 50`;
};
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

// ---------- State ----------
const DEFAULT_SETTINGS = { depth: 45, topLabel: "Visiting Sideline", bottomLabel: "Home Sideline", view: "both" };
function exampleState() {
  const H = 160, items = [], conns = [];
  const add = (type, x, y, extra = {}) => { const T = TYPES[type]; const it = { id: uid(), type, label: T.short || T.name, x, y, w: T.w, h: T.h, rot: 0, notes: "", ...extra }; items.push(it); return it; };
  const link = (a, b, kind, extra = {}) => conns.push({ id: uid(), from: a.id, to: b.id, kind, label: "", notes: "", pts: [], ...extra });
  [108, 121, 134, 166, 179, 192].forEach(x => add("bench", x, H + 9));
  const h1 = add("ds350", 121, H + 17, { label: "DS-350 A" });
  const h2 = add("ds350", 150, H + 17, { label: "DS-350 B" });
  const h3 = add("ds350", 179, H + 17, { label: "DS-350 C" });
  const bank = add("gasbank", 150, H + 33);
  const t1 = add("threeway", 134, H + 26);
  const t2 = add("threeway", 166, H + 26);
  const pb = add("powerbox", 200, H + 33);
  link(bank, t1, "gas", { label: "50 ft" });
  link(t1, h1, "gas", { label: "25 ft", notes: "Example: between the 3-way and DS-350 A — A) ball valve, B) regulator, C) 25 ft hose." });
  link(t1, h2, "gas", { label: "25 ft" });
  link(bank, t2, "gas", { label: "50 ft" });
  link(t2, h3, "gas", { label: "25 ft" });
  link(pb, h3, "power", { label: "Ext. cord", pts: [{ x: 200, y: H + 22 }] });
  add("team", 150, -10, { w: 66, h: 4, label: "Visiting team benches" });
  add("team", 96, -24, { w: 14, h: 8, label: "Medical" });
  add("team", 204, -22, { w: 12, h: 6, label: "Hydration" });
  add("team", 150, -28, { w: 26, h: 6, label: "Equipment trunks" });
  add("text", 150, H + 41, { w: 40, h: 2.2, label: "Example layout — replace with your job" });
  return { id: null, name: "Example – heat season", settings: { ...DEFAULT_SETTINGS, view: "bottom" }, items, conns };
}
function normalize(s) {
  s.settings = { ...DEFAULT_SETTINGS, ...(s.settings || {}) };
  s.items = (s.items || []).filter(i => TYPES[i.type]);
  const ids = new Set(s.items.map(i => i.id));
  s.conns = (s.conns || []).filter(c => ids.has(c.from) && ids.has(c.to)).map(c => ({ pts: [], label: "", notes: "", ...c }));
  return s;
}

let state, dirty = false;
let sel = null;               // {t:'item'|'conn', id}
let mode = "select";          // 'select' | 'connect'
let connKind = "gas", connSrc = null, hoverPt = null;
let cam = null, ppf = 3;
let drag = null;
let hist = [], redo = [];
let layouts = [], store = null, saving = false, pendingConfirm = null;
let lastBendTap = null;

const draft = lsGet("dsp-draft-v1");
if (draft && draft.state) { state = normalize(draft.state); dirty = !!draft.dirty; }
else state = exampleState();

const byId = id => state.items.find(i => i.id === id);
const connById = id => state.conns.find(c => c.id === id);
const snapshot = () => JSON.stringify({ settings: state.settings, items: state.items, conns: state.conns });
function pushHist() { hist.push(snapshot()); if (hist.length > 120) hist.shift(); redo = []; }
function restore(json) {
  const d = JSON.parse(json);
  state.settings = d.settings; state.items = d.items; state.conns = d.conns;
  if (sel && !(sel.t === "item" ? byId(sel.id) : connById(sel.id))) sel = null;
  changed(); renderPanel();
}
function undo() { if (!hist.length) return; redo.push(snapshot()); restore(hist.pop()); }
function redoFn() { if (!redo.length) return; hist.push(snapshot()); restore(redo.pop()); }

let draftTimer = null;
function saveDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(() => lsSet("dsp-draft-v1", { state, dirty }), 400); }
function changed() { dirty = true; saveDraft(); render(); updateBar(); }

// ---------- Geometry ----------
function bbox(it) {
  const a = it.rot * Math.PI / 180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
  return { bw: it.w * c + it.h * s, bh: it.w * s + it.h * c };
}
function connPts(c) {
  const a = byId(c.from), b = byId(c.to);
  if (!a || !b) return null;
  return [{ x: a.x, y: a.y }, ...c.pts, { x: b.x, y: b.y }];
}
function polyLen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y); return L; }
function polyMid(p) {
  const half = polyLen(p) / 2; let acc = 0;
  for (let i = 1; i < p.length; i++) {
    const seg = Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
    if (acc + seg >= half && seg > 0) { const t = (half - acc) / seg; return { x: p[i - 1].x + (p[i].x - p[i - 1].x) * t, y: p[i - 1].y + (p[i].y - p[i - 1].y) * t }; }
    acc += seg;
  }
  return p[0];
}
function extent(view) {
  const D = state.settings.depth;
  if (view === "top") return { x: 42, y: -D - 6, w: 216, h: D + 18 };
  if (view === "bottom") return { x: 42, y: FIELD_W - 12, w: 216, h: D + 18 };
  return { x: -36, y: -D - 6, w: 372, h: FIELD_W + 2 * D + 12 };
}
function noteEntries() {

  if (mod && e.key.toLowerCase() === "y" && !typing) { e.preventDefault(); redoFn(); return; }
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); save(false); return; }
  if (typing) return;
  if (e.key === "Escape") { if (mode === "connect") setMode("select"); else if (sel) { sel = null; renderPanel(); render(); } closePop(); }

// ---------- Saved layouts (shared store, with an on-device fallback) ----------
function localStore() {
  const K = "dsp-layouts-v1", listeners = [];
  const read = () => lsGet(K) || {};
  const emit = () => { const all = read(); layouts = Object.entries(all).map(([id, d]) => ({ id, ...d })).sort((a, b) => b.updatedAt - a.updatedAt); listeners.forEach(f => f()); };
  return {
    kind: "local",
    start(cb) { listeners.push(cb); emit(); },
    async save(id, doc) { const all = read(); all[id] = doc; lsSet(K, all); emit(); },
    async remove(id) { const all = read(); delete all[id]; lsSet(K, all); emit(); },
    async get(id) { return layouts.find(l => l.id === id); }
  };
}
function apiStore() {
  const listeners = [];
  const emit = () => listeners.forEach(f => f());
  const fail = async r => { let m = ""; try { m = (await r.json()).error || ""; } catch {} throw new Error(m || `Server returned ${r.status}`); };
  const sortL = () => layouts.sort((a, b) => b.updatedAt - a.updatedAt);
  const st = {
    kind: "api", error: null,
    start(cb) { listeners.push(cb); st.refresh(); setInterval(() => { if (!document.hidden) st.refresh(); }, 30000); },
    async refresh() {
      try { const r = await fetch("/api/layouts", { headers: { accept: "application/json" } }); if (!r.ok) await fail(r); layouts = (await r.json()).layouts || []; sortL(); st.error = null; }
      catch (e) { st.error = e.message; }
      emit();
    },
    async get(id) { const r = await fetch(`/api/layouts/${encodeURIComponent(id)}`); if (!r.ok) await fail(r); return r.json(); },
    async save(id, doc) {
      const r = await fetch(`/api/layouts/${encodeURIComponent(id)}`, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(doc) });
      if (!r.ok) await fail(r);
      layouts = layouts.filter(l => l.id !== id); layouts.push({ id, name: doc.name, updatedAt: doc.updatedAt }); sortL(); emit();
    },
    async remove(id) {
      const r = await fetch(`/api/layouts/${encodeURIComponent(id)}`, { method: "DELETE" });
      if (!r.ok) await fail(r);
      layouts = layouts.filter(l => l.id !== id); emit();
    }
  };
  return st;
}
async function initStore() {
  let ok = false;
  if (location.protocol.startsWith("http")) {
    try { const r = await fetch("/api/layouts", { headers: { accept: "application/json" } }); ok = r.ok && (r.headers.get("content-type") || "").includes("json"); } catch {}
  }
  store = ok ? apiStore() : localStore();
  store.start(() => { if (!$("#layouts-pop").hidden) renderPop(); });
}
async function save(asCopy) {

  const name = (nameIn.value || "").trim() || "Untitled layout";
  const id = (!asCopy && state.id) || uid();
  const doc = { name: asCopy ? `${name} (copy)` : name, updatedAt: Date.now(), data: deep({ settings: state.settings, items: state.items, conns: state.conns }) };
  saving = true; updateBar();
  try {
    await store.save(id, doc);
    state.id = id; state.name = doc.name; dirty = false; nameIn.value = doc.name;
    toast(store.kind !== "local" ? `Saved “${doc.name}”` : `Saved “${doc.name}” in this browser`);
  } catch (e) {

}

const fmtDate = t => new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

function wrap(text, n) {

  if (line) out.push(line); return out;
}

  const lines = []; notes.forEach(n => wrap(`${n.title}: ${n.text}`, cpl).forEach((t, i) => lines.push({ t, n: i === 0 ? n.n : null })));
  const keyH = notes.length ? pad * 2 + 4 + lines.length * lh : 0;
  const vb = { x: ext.x, y: ext.y - headH, w: ext.w, h: ext.h + headH + keyH };
  const S = Math.min(7, 4200 / vb.w), W = Math.round(vb.w * S), H = Math.round(vb.h * S);
  const used = Object.keys(KINDS).filter(k => state.conns.some(c => c.kind === k));
  let legend = "", lx = vb.x + vb.w - pad;
  used.slice().reverse().forEach(k => {
    const K = KINDS[k], tw = K.name.length * 1.1 + 1;
    legend += `<text x="${lx}" y="${vb.y + 8.2}" font-family="${SVG_FONT}" font-size="2.2" fill="#dfe6e2" text-anchor="end">${K.name}</text>`;
    lx -= tw + 0.8;
    legend += `<line x1="${lx - 5}" y1="${vb.y + 7.5}" x2="${lx}" y2="${vb.y + 7.5}" stroke="${K.color}" stroke-width="${K.w}" ${K.dash ? `stroke-dasharray="${K.dash}"` : ""}/>`;
    lx -= 8;
  });
  const viewName = state.settings.view === "both" ? "Both sidelines" : state.settings.view === "top" ? state.settings.topLabel : state.settings.bottomLabel;
  let key = "";
  if (notes.length) {
    const ky = ext.y + ext.h;
    key += `<rect x="${vb.x}" y="${ky}" width="${vb.w}" height="${keyH}" fill="#141b17"/>`;
    key += `<text x="${vb.x + pad}" y="${ky + pad + 2.2}" font-family="${SVG_FONT}" font-weight="700" font-size="2.6" fill="#ffffff">NOTES</text>`;
    lines.forEach((l, i) => {
      const y = ky + pad + 4 + (i + 0.8) * lh;
      if (l.n) key += badge(vb.x + pad + 1.2, y - fsK * 0.35, l.n);
      key += `<text x="${vb.x + pad + 3.4}" y="${y}" font-family="Arial, Helvetica, sans-serif" font-size="${fsK}" fill="#e9eeeb">${esc(l.t)}</text>`;
    });
  }
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}">
    <rect x="${vb.x}" y="${vb.y}" width="${vb.w}" height="${vb.h}" fill="#1f2a24"/>
    <svg x="${ext.x}" y="${ext.y}" width="${ext.w}" height="${ext.h}" viewBox="${ext.x} ${ext.y} ${ext.w} ${ext.h}" overflow="hidden">${sceneMarkup(false)}</svg>
    <rect x="${vb.x}" y="${vb.y}" width="${vb.w}" height="${headH}" fill="#141b17"/>
    <text x="${vb.x + pad}" y="${vb.y + 6}" font-family="${SVG_FONT}" font-weight="700" font-size="4.4" fill="#ffffff">${esc(state.name || "Untitled layout")}</text>
    <text x="${vb.x + pad}" y="${vb.y + 10.2}" font-family="${SVG_FONT}" font-size="2.3" fill="#a9b6ae">${esc(viewName)} · ${esc(new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }))} · Red lines mark the 25-yard cutoffs</text>
    ${legend}${key}
  </svg>`;
  const btn = $("#btn-export"); btn.disabled = true; btn.textContent = "Exporting…";
  try {
    const img = new Image();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);
    await img.decode();
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    cv.getContext("2d").drawImage(img, 0, 0, W, H);
    const blob = await new Promise((res, rej) => cv.toBlob(b => (b ? res(b) : rej(new Error("png"))), "image/png"));
    const fname = ((state.name || "sideline-layout").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-") || "sideline-layout") + ".png";
    const url = URL.createObjectURL(blob), link = document.createElement("a");
    link.href = url; link.download = fname; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast("Image downloaded");
  } catch (e) {
    toast("Couldn't build the image. Try again.");
  }
  btn.disabled = false; btn.textContent = "Export image";
}
$("#btn-export").onclick = exportImage;
$("#img-close").onclick = () => ($("#img-overlay").hidden = true);

// ---------- Boot ----------
renderLib(); renderViewSeg(); updateBar(); fit(); renderPanel();
requestAnimationFrame(() => render());
initStore();
})();
</script>
</body>

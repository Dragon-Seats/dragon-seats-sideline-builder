<style>
/* Layout: one-screen tool. Top bar, then library | field | details. Stacks on phones. */
:root {
  --bg: #eceef0;
  --panel: #ffffff;
  --ink: #1f2022;
  --muted: #5e6064;
  --line: #d5d7da;
  --chip: #f2f3f5;
  --accent: #aa0201;
  --accent-ink: #ffffff;
  --steel: #6e6f71;
  --focus: #1c7ed6;
  --danger: #c92a2a;
  --canvas: #1c1e21;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121315; --panel: #1b1c1f; --ink: #e8e9eb; --muted: #9a9da2; --line: #2f3135;
    --chip: #24262a; --accent: #e3342f; --accent-ink: #ffffff; --steel: #b9bbbf; --focus: #4dabf7; --danger: #ff6b6b; --canvas: #141517;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121315; --panel: #1b1c1f; --ink: #e8e9eb; --muted: #9a9da2; --line: #2f3135;
  --chip: #24262a; --accent: #e3342f; --accent-ink: #ffffff; --steel: #b9bbbf; --focus: #4dabf7; --danger: #ff6b6b; --canvas: #141517;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }

/* Top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.brand { display: flex; align-items: center; gap: 9px; margin-right: 6px; text-decoration: none; color: inherit; }
.brand-mark { height: 38px; width: auto; display: block; }
.brand-text { display: grid; gap: 3px; }
.brand-word { height: 15px; width: auto; display: block; }
.brand-app { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--steel); line-height: 1; }
.brand .dk { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand .lt { display: none; } :root:not([data-theme="light"]) .brand .dk { display: block; } }
:root[data-theme="dark"] .brand .lt { display: none; } :root[data-theme="dark"] .brand .dk { display: block; }
.app { border-top: 3px solid var(--accent); padding-top: 9px; }
.name { min-width: 0; width: 230px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-weight: 600; }
.dirty { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.grp { display: flex; align-items: center; gap: 6px; position: relative; }
.btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.primary:hover { filter: brightness(1.08); }
.sel { padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 7px 11px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.spacer { flex: 1; }

.pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: 320px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; display: grid; gap: 2px; max-height: 70vh; overflow: auto; }
.pop-row { text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; }
.pop-row:hover { background: var(--chip); }
.pop-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 10px 4px; }
.pop-item { display: flex; gap: 4px; align-items: stretch; }
.pop-item .pop-row { flex: 1; min-width: 0; }
.pop-item small { display: block; color: var(--muted); font-size: 12px; }
.pop-item .x { border: 0; background: transparent; color: var(--muted); padding: 0 10px; border-radius: 6px; font-size: 12px; }
.pop-item .x:hover { color: var(--danger); background: var(--chip); }
.pop-note { font-size: 12px; color: var(--muted); padding: 8px 10px; }
.warn { color: var(--danger); font-weight: 600; }

/* Main */
.main { display: grid; grid-template-columns: 176px minmax(0, 1fr) 292px; gap: 10px; min-height: 0; }
.lib, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; min-height: 0; }
.lib { padding: 10px; display: flex; flex-direction: column; gap: 12px; }
.lib-group { display: grid; gap: 4px; }
.lib-h, .p-h { font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--steel); }
.lib-btn { display: flex; align-items: center; gap: 8px; text-align: left; padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; background: var(--chip); touch-action: none; user-select: none; }
.lib-btn:hover { border-color: var(--line); }
.lib-btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
.sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(128,130,134,.6); }
.sw.round { border-radius: 50%; }
.lib-tip { font-size: 12px; color: var(--muted); line-height: 1.4; }

.stage { position: relative; min-height: 0; border-radius: 8px; overflow: hidden; background: var(--canvas); }
.stage svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
.stage.connecting svg { cursor: crosshair; }
.views { position: absolute; top: 10px; left: 10px; z-index: 2; max-width: calc(100% - 20px); overflow-x: auto; }
.hint { position: absolute; top: 54px; left: 10px; right: 10px; pointer-events: none; display: flex; }
.hint span { background: rgba(10,16,12,.82); color: #f1f5f2; padding: 6px 10px; border-radius: 6px; font-size: 13px; max-width: 100%; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { min-width: 36px; height: 34px; border-radius: 6px; border: 1px solid rgba(255,255,255,.2); background: rgba(10,16,12,.82); color: #f1f5f2; font-weight: 600; }
.toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: #f8f9fa; color: #111; padding: 8px 14px; border-radius: 6px; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: calc(100% - 120px); text-align: center; }

.panel { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.p-title { font-family: var(--font-display); font-style: italic; font-size: 23px; font-weight: 800; line-height: 1.1; text-wrap: balance; display: flex; align-items: center; gap: 8px; }
.p-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.f { display: grid; gap: 4px; }
.f label { font-size: 12px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.f textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
.f .help { font-size: 12px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.btn.danger { color: var(--danger); }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-variant-numeric: tabular-nums; }
.stat div:nth-child(even) { text-align: right; font-weight: 600; }
.empty { color: var(--muted); font-size: 13px; }
.notes-list { display: grid; gap: 6px; }
.note-btn { display: grid; grid-template-columns: 22px 1fr; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 8px; }
.note-btn b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #ffd43b; color: #111; font-size: 12px; }
.note-btn span { min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
.note-btn small { display: block; color: var(--muted); }
.conn-list { display: grid; gap: 4px; }
.conn-btn { display: flex; gap: 8px; align-items: center; text-align: left; border: 0; background: var(--chip); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.conn-btn i { width: 18px; height: 4px; border-radius: 2px; flex: none; }
.legend { display: grid; gap: 6px; font-size: 13px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend svg { flex: none; }
.how { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); font-size: 13px; line-height: 1.4; }

.ghost { position: fixed; z-index: 50; pointer-events: none; padding: 6px 10px; border-radius: 6px; background: var(--ink); color: var(--panel); font-weight: 600; transform: translate(-50%, -130%); }
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 20px; }
.overlay-card { background: var(--panel); border-radius: 10px; padding: 14px; max-width: min(1100px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 10px; }
.overlay-card img { width: 100%; height: auto; border-radius: 6px; }

/* Export dialog */
.exp-card { background: var(--panel); border-radius: 10px; width: min(1240px, 100%); height: min(880px, 100%); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.exp-head, .exp-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
.exp-head { border-bottom: 1px solid var(--line); }
.exp-foot { border-top: 1px solid var(--line); flex-wrap: wrap; }
.exp-head h2 { margin: 0; font-family: var(--font-display); font-style: italic; font-size: 24px; font-weight: 800; flex: 1; }
.exp-body { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 0; }
.exp-opts { overflow: auto; padding: 14px 16px 20px; display: grid; gap: 18px; align-content: start; border-right: 1px solid var(--line); }
.exp-prev { overflow: auto; padding: 18px; background: var(--bg); display: grid; place-items: start center; }
.exp-pages { display: grid; gap: 18px; width: 100%; justify-items: center; }
.logo-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.logo-thumb { max-height: 40px; max-width: 120px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 3px; }
.logo-empty { font-size: 12px; color: var(--muted); padding: 0 4px; }
.exp-prev img { max-width: 100%; height: auto; background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 18px rgba(0,0,0,.12); }
.xs { display: grid; gap: 6px; }
.xs .seg { width: 100%; }
.xs .seg button { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; cursor: pointer; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.chk small { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.chk:has(input:disabled) { opacity: .5; cursor: default; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--focus); text-decoration: underline; font-size: 12px; }
.help { font-size: 12px; color: var(--muted); }
@media (max-width: 900px) {
  .exp-card { height: 100%; }
  .exp-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 38vh minmax(0, 1fr); }
  .exp-prev { order: -1; }
  .exp-opts { border-right: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 1150px) { .main { grid-template-columns: 152px minmax(0, 1fr) 260px; } }
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-rows: auto auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .lib { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 14px; }
  .lib-group { grid-auto-flow: column; grid-template-rows: auto auto; align-content: start; }
  .lib-group .lib-h { grid-row: 1; }
  .lib-tip { display: none; }
  .stage { height: 64vh; min-height: 360px; }
  .name { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .lib-btn, .pop-row { transition: border-color .12s, background-color .12s; } }
</style>

const DEFAULT_SETTINGS = { depth: 45, topLabel: "Visiting Sideline", bottomLabel: "Home Sideline", view: "both", exp: EXP_DEFAULT };
function exampleState() {
  const H = 160, items = [], conns = [];
  const add = (type, x, y, extra = {}) => { const T = TYPES[type]; const it = { id: uid(), type, label: T.short || T.name, x, y, w: T.w, h: T.h, rot: 0, notes: "", ...extra }; items.push(it); return it; };
  const link = (a, b, kind, extra = {}) => conns.push({ id: uid(), from: a.id, to: b.id, kind, label: "", notes: "", pts: [], ...extra });
  [108, 121, 134, 166, 179, 192].forEach(x => add("bench", x, H + 9));
  const h1 = add("ds350", 121, H + 17, { label: "DS-350 A" });
  const h2 = add("ds350", 150, H + 17, { label: "DS-350 B" });
  const h3 = add("ds350", 179, H + 17, { label: "DS-350 C" });
  const bank = add("gasbank", 150, H + 33);
  const t1 = add("threeway", 134, H + 26);
  const t2 = add("threeway", 166, H + 26);

  link(t1, h2, "gas", { label: "25 ft" });
  link(bank, t2, "gas", { label: "50 ft" });
  link(t2, h3, "gas", { label: "25 ft" });
  link(pb, h3, "power", { label: "Ext. cord", pts: [{ x: 200, y: H + 22 }] });
  add("team", 150, -10, { w: 66, h: 4, label: "Visiting team benches" });
  add("team", 96, -24, { w: 14, h: 8, label: "Medical" });
  add("team", 204, -22, { w: 12, h: 6, label: "Hydration" });
  add("team", 150, -28, { w: 26, h: 6, label: "Equipment trunks" });
  add("text", 150, H + 41, { w: 40, h: 2.2, label: "Example layout — replace with your job" });
  return { id: null, name: "Example – heat season", settings: { ...DEFAULT_SETTINGS, view: "bottom" }, items, conns };
}
function normalize(s) {
  s.settings = { ...DEFAULT_SETTINGS, ...(s.settings || {}) };
  const ex = s.settings.exp || {};
  s.settings.exp = { ...EXP_DEFAULT, ...ex, cats: { ...EXP_DEFAULT.cats, ...(ex.cats || {}) }, kinds: { ...EXP_DEFAULT.kinds, ...(ex.kinds || {}) } };
  s.items = (s.items || []).filter(i => TYPES[i.type]);
  s.items.forEach(i => { if (i.type === "bench" && i.label === "Dragon Seat") i.label = "Bench"; });
  const ids = new Set(s.items.map(i => i.id));
  s.conns = (s.conns || []).filter(c => ids.has(c.from) && ids.has(c.to)).map(c => ({ pts: [], label: "", notes: "", ...c }));
  return s;
}

const byId = id => state.items.find(i => i.id === id);
const connById = id => state.conns.find(c => c.id === id);
const snapshot = () => JSON.stringify({ settings: state.settings, items: state.items, conns: state.conns });
function pushHist() { hist.push(snapshot()); if (hist.length > 120) hist.shift(); redo = []; }
function restore(json) {
  const d = JSON.parse(json);
  state.settings = d.settings; state.items = d.items; state.conns = d.conns;
  if (sel && !(sel.t === "item" ? byId(sel.id) : connById(sel.id))) sel = null;
  changed(); renderPanel();
}
function undo() { if (!hist.length) return; redo.push(snapshot()); restore(hist.pop()); }
function redoFn() { if (!redo.length) return; hist.push(snapshot()); restore(redo.pop()); }

let draftTimer = null;
function saveDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(() => lsSet("dsp-draft-v1", { state, dirty }), 400); }
function changed() { dirty = true; saveDraft(); render(); updateBar(); }

// ---------- Geometry ----------
function bbox(it) {
  const a = it.rot * Math.PI / 180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
  return { bw: it.w * c + it.h * s, bh: it.w * s + it.h * c };
}
function connPts(c) {
  const a = byId(c.from), b = byId(c.to);
  if (!a || !b) return null;
  return [{ x: a.x, y: a.y }, ...c.pts, { x: b.x, y: b.y }];
}
function polyLen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y); return L; }
function polyMid(p) {
  const half = polyLen(p) / 2; let acc = 0;
  for (let i = 1; i < p.length; i++) {
    const seg = Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
    if (acc + seg >= half && seg > 0) { const t = (half - acc) / seg; return { x: p[i - 1].x + (p[i].x - p[i - 1].x) * t, y: p[i - 1].y + (p[i].y - p[i - 1].y) * t }; }
    acc += seg;
  }
  return p[0];
}
function extent(view) {
  const D = state.settings.depth;
  if (view === "top") return { x: 42, y: -D - 6, w: 216, h: D + 18 };
  if (view === "bottom") return { x: 42, y: FIELD_W - 12, w: 216, h: D + 18 };

  if (view === "bottom") return { x: 42, y: FIELD_W - 12, w: 216, h: D + 12 };

// Shared title block for both pages
function activeLogo(e) {

}
function drawHeader(e, W, f, M, pageLabel) {
  const view = e.view || state.settings.view, inner = W - 2 * M;
  let m = "", x0 = M;
  const lg = activeLogo(e);
  if (lg) {
    const lh = 124 * f, lw = Math.min(420 * f, lh * lg.w / lg.h), lhh = lw * lg.h / lg.w;
    m += `<image x="${r2(M)}" y="${r2(M + (lh - lhh) / 2)}" width="${r2(lw)}" height="${r2(lhh)}" href="${lg.url}" preserveAspectRatio="xMinYMid meet"/>`;

  m += svgText(x0, M + 50 * f, title, 58 * f, { bold: true });
  const fields = [["Venue", e.venue], ["Event date", e.eventDate], ["Sideline shown", viewName(view)]]
    .map(([k, v]) => [k, String(v || "").trim()]).filter(([, v]) => v);
  let fx = x0; const fy = M + 98 * f;
  fields.forEach(([k, v]) => {
    m += svgText(fx, fy, k, 20 * f, { fill: P_MUTED });
    m += svgText(fx, fy + 32 * f, v, 27 * f, { semi: true });
    fx += Math.max(k.length * 20 * 0.55, v.length * 27 * 0.56) * f + 80 * f;
  });
  const rx = W - M; let ry = M + 36 * f;
  if ((e.company || "").trim()) { m += svgText(rx, ry, e.company.trim(), 34 * f, { bold: true, anchor: "end" }); ry += 38 * f; }
  if ((e.preparedBy || "").trim()) { m += svgText(rx, ry, "Prepared by " + e.preparedBy.trim(), 22 * f, { fill: P_MUTED, anchor: "end" }); ry += 30 * f; }
  m += svgText(rx, ry, "Issued " + issuedDate(), 22 * f, { fill: P_MUTED, anchor: "end" }); ry += 30 * f;
  if (pageLabel) m += svgText(rx, ry, pageLabel, 22 * f, { semi: true, anchor: "end" });
  let y = M + 164 * f;
  m += `<rect x="${r2(M)}" y="${r2(y)}" width="${r2(inner)}" height="${r2(4 * f)}" fill="${DS_RED}"/>`;
  return { m, y: y + 34 * f };
}
function drawFooter(e, W, f, M, y, left) {
  let m = `<rect x="${r2(M)}" y="${r2(y + 40 * f)}" width="${r2(W - 2 * M)}" height="${r2(1.5 * f)}" fill="${P_RULE}"/>`;
  y += 80 * f;
  m += svgText(M, y, left, 20 * f, { fill: P_MUTED });

}
const wrapSvg = (W, H, body) => `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#ffffff"/>${body}</svg>`;

// ---------- Page 1: the site plan ----------
function buildExport(e, W) {
  const o = expOpts(e), view = e.view || state.settings.view, ext = exportExtent(view);
  const f = W / 3000, M = 90 * f, inner = W - 2 * M, pages = pageCount(e);
  let y = M, body = "";
  if (e.header) { const h = drawHeader(e, W, f, M, pages > 1 ? "Site plan, page 1 of 2" : ""); body += h.m; y = h.y; }

  const mapH = inner * ext.h / ext.w;
  body += `<svg x="${r2(M)}" y="${r2(y)}" width="${r2(inner)}" height="${r2(mapH)}" viewBox="${ext.x} ${ext.y} ${ext.w} ${ext.h}" overflow="hidden">${sceneMarkup(false, o)}</svg>`;
  body += `<rect x="${r2(M)}" y="${r2(y)}" width="${r2(inner)}" height="${r2(mapH)}" fill="none" stroke="${P_RULE}" stroke-width="${r2(2 * f)}"/>`;
  y += mapH;

  const fs = 24 * f, lh = 36 * f, headFs = 24 * f;
  const visItems = state.items.filter(o.visItem), visConns = state.conns.filter(o.visConn);
  const kindsUsed = Object.keys(KINDS).filter(k => visConns.some(c => c.kind === k));
  const groupsUsed = GROUPS.filter(([g]) => g !== "text" && visItems.some(i => GROUP_OF[i.type] === g));
  const notes = e.notesList ? noteEntries(o) : [];
  const head = (x, yy, w, label) => svgText(x, yy + headFs, label, headFs, { bold: true }) + `<rect x="${r2(x)}" y="${r2(yy + headFs + 12 * f)}" width="${r2(w)}" height="${r2(1.5 * f)}" fill="${P_RULE}"/>`;
  const headH = headFs + 30 * f;
  const cols = [];

  if (e.legend && (groupsUsed.length || kindsUsed.length || o.cutoffs || o.offLimits)) cols.push({ w: 1, draw(x, y0, w) {
    let m = head(x, y0, w, "Legend"), yy = y0 + headH; const sw = 46 * f;
    const row = (sym, label) => { m += sym(x, yy + lh / 2); m += svgText(x + sw + 14 * f, yy + lh / 2 + fs * 0.35, label, fs); yy += lh; };
    groupsUsed.forEach(([g, label, types]) => {
      const C = CATS[TYPES[types[0]].cat], fill = g === "team" ? o.theme.teamA : C.fill, stroke = g === "team" ? o.theme.teamStroke : C.stroke;
      row((sx, sy) => `<rect x="${r2(sx + 8 * f)}" y="${r2(sy - 11 * f)}" width="${r2(30 * f)}" height="${r2(22 * f)}" rx="${r2(3 * f)}" fill="${fill}" stroke="${stroke}" stroke-width="${r2(1.5 * f)}"/>`, label);
    });
    kindsUsed.forEach(k => {
      const K = KINDS[k], dash = K.dash ? ` stroke-dasharray="${K.dash.split(" ").map(v => r2(v * 9 * f)).join(" ")}"` : "";
      row((sx, sy) => `<line x1="${r2(sx)}" y1="${r2(sy)}" x2="${r2(sx + sw)}" y2="${r2(sy)}" stroke="${o.theme.kind(k)}" stroke-width="${r2(K.w * 8 * f)}" stroke-linecap="round"${dash}/>`, K.name);
    });
    if (o.cutoffs) row((sx, sy) => `<line x1="${r2(sx + sw / 2)}" y1="${r2(sy - 14 * f)}" x2="${r2(sx + sw / 2)}" y2="${r2(sy + 14 * f)}" stroke="${o.theme.cut}" stroke-width="${r2(5 * f)}"/>`, "25-yard cutoff");
    if (o.offLimits) row((sx, sy) => `<rect x="${r2(sx + 8 * f)}" y="${r2(sy - 11 * f)}" width="${r2(30 * f)}" height="${r2(22 * f)}" fill="rgba(224,49,49,0.12)" stroke="rgba(224,49,49,0.5)" stroke-width="${r2(1.5 * f)}"/>`, "Off limits");
    return { m, h: yy - y0 };
  }});

  if (e.equipList && (visItems.some(i => i.type !== "text") || visConns.length)) cols.push({ w: 1, draw(x, y0, w) {
    let m = head(x, y0, w, "Equipment"), yy = y0 + headH;
    const counts = {}; visItems.forEach(i => { if (i.type !== "text") counts[i.type] = (counts[i.type] || 0) + 1; });
    Object.keys(TYPES).filter(t => counts[t]).forEach(t => {
      m += svgText(x, yy + lh / 2 + fs * 0.35, TYPES[t].name, fs);

      m += svgText(x + w, yy + lh / 2 + fs * 0.35, `${cs.length} run${cs.length > 1 ? "s" : ""}, ~${ft} ft`, fs, { semi: true, anchor: "end" }); yy += lh;
    });

    let m = head(x, y0, w, "Notes"), yy = y0 + headH; const ind = o.noteMarkers ? 46 * f : 0, tw = w - ind;
    notes.forEach(n => {
      if (o.noteMarkers) m += `<circle cx="${r2(x + 16 * f)}" cy="${r2(yy + lh / 2)}" r="${r2(15 * f)}" fill="#ffd43b" stroke="#111" stroke-width="${r2(1.5 * f)}"/>` + svgText(x + 16 * f, yy + lh / 2 + 7 * f, String(n.n), 19 * f, { bold: true, anchor: "middle", fill: "#111" });
      wrapPx(n.title, tw, fs, true).forEach(l => { m += svgText(x + ind, yy + lh / 2 + fs * 0.35, l, fs, { bold: true }); yy += lh; });
      wrapPx(n.text, tw, fs).forEach(l => { m += svgText(x + ind, yy + lh / 2 + fs * 0.35, l, fs, { fill: "#3d4841" }); yy += lh; });

    y += 48 * f;
    const gap = 70 * f, units = cols.reduce((a, c) => a + c.w, 0), unitW = (inner - gap * (cols.length - 1)) / units;
    let x = M, maxH = 0;

    y += maxH;
  }
  if (e.footer) { const ft = drawFooter(e, W, f, M, y, o.cutoffs ? "Red lines mark the 25-yard cutoffs. No equipment is placed past them." : "Layout drawn to approximate scale. Confirm placement on site."); body += ft.m; y = ft.y; }
  const H = Math.round(y + M);

}

// ---------- Page 2: equipment breakdown ----------
function sidelineOf(it) {
  if (it.y < 0) return { side: state.settings.topLabel, back: Math.round(-it.y) };
  if (it.y > FIELD_W) return { side: state.settings.bottomLabel, back: Math.round(it.y - FIELD_W) };
  return { side: "On the field", back: null };
}
function ydShort(x) {
  const yd = x / 3, near = Math.round(yd <= 50 ? yd : 100 - yd);
  return near === 50 ? "At the 50" : `${near} yd, ${yd < 50 ? "left" : "right"} of 50`;
}
const sizeOf = it => (TYPES[it.type].circle ? `${r2(it.w)} ft round` : `${r2(it.w)} × ${r2(it.h)} ft`);

function drawTable(x, y, w, cols, rows, f, opt = {}) {
  const fs = 22 * f, lh = 30 * f, padY = 12 * f, padX = 14 * f;
  const total = cols.reduce((a, c) => a + c.w, 0), ws = cols.map(c => (c.w / total) * w);
  let m = "", yy = y;
  // header row
  let cx = x;
  cols.forEach((c, i) => {
    const tx = c.align === "right" ? cx + ws[i] - padX : cx + padX;
    m += svgText(tx, yy + 26 * f, c.label, 19 * f, { semi: true, fill: P_MUTED, anchor: c.align === "right" ? "end" : null });
    cx += ws[i];
  });
  yy += 42 * f;
  m += `<rect x="${r2(x)}" y="${r2(yy)}" width="${r2(w)}" height="${r2(2.5 * f)}" fill="${P_INK}"/>`;
  yy += 2.5 * f;
  rows.forEach((r, ri) => {
    const cells = r.cells.map((v, i) => wrapPx(v == null || v === "" ? "–" : String(v), ws[i] - padX * 2, fs, cols[i].bold));
    const h = Math.max(...cells.map(c => c.length)) * lh + padY * 2;
    if (ri % 2 === 1) m += `<rect x="${r2(x)}" y="${r2(yy)}" width="${r2(w)}" height="${r2(h)}" fill="${P_ZEBRA}"/>`;
    let cx2 = x;
    cells.forEach((lines, i) => {
      const c = cols[i];
      if (i === 0 && r.swatch) m += r.swatch(cx2 + padX, yy + padY + lh / 2);
      const off = i === 0 && r.swatch ? 40 * f : 0;
      lines.forEach((l, li) => {
        const tx = c.align === "right" ? cx2 + ws[i] - padX : cx2 + padX + off;
        m += svgText(tx, yy + padY + li * lh + lh * 0.72, l, fs, { bold: c.bold, fill: l === "–" ? P_MUTED : (c.muted ? "#3d4841" : P_INK), anchor: c.align === "right" ? "end" : null });
      });
      cx2 += ws[i];
    });
    yy += h;
    m += `<rect x="${r2(x)}" y="${r2(yy)}" width="${r2(w)}" height="${r2(1 * f)}" fill="${P_RULE}"/>`;
  });
  if (opt.total) {
    yy += 4 * f;
    let cx3 = x;
    opt.total.forEach((v, i) => {
      if (v) { const c = cols[i]; m += svgText(c.align === "right" ? cx3 + ws[i] - padX : cx3 + padX, yy + 34 * f, v, fs, { bold: true, anchor: c.align === "right" ? "end" : null }); }
      cx3 += ws[i];
    });
    yy += 50 * f;
  }
  return { m, h: yy - y };
}

function buildBreakdown(e, W) {
  const o = expOpts(e), view = e.view || state.settings.view, f = W / 3000, M = 90 * f, inner = W - 2 * M;
  const T = o.theme;
  const items = state.items.filter(i => i.type !== "text" && o.visItem(i));
  const order = Object.keys(TYPES);
  items.sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type) || a.y - b.y || a.x - b.x);
  const conns = state.conns.filter(o.visConn);
  const kindsUsed = Object.keys(KINDS).filter(k => conns.some(c => c.kind === k));
  const swatchFor = type => (sx, sy) => {
    const Ty = TYPES[type], C = CATS[Ty.cat], fill = Ty.cat === "team" ? T.teamA : C.fill, stroke = Ty.cat === "team" ? T.teamStroke : C.stroke;
    return Ty.circle ? `<circle cx="${r2(sx + 12 * f)}" cy="${r2(sy - 1 * f)}" r="${r2(11 * f)}" fill="${fill}" stroke="${stroke}" stroke-width="${r2(1.5 * f)}"/>`
      : `<rect x="${r2(sx)}" y="${r2(sy - 11 * f)}" width="${r2(26 * f)}" height="${r2(20 * f)}" rx="${r2(3 * f)}" fill="${fill}" stroke="${stroke}" stroke-width="${r2(1.5 * f)}"/>`;
  };
  const kindSwatch = k => (sx, sy) => {
    const K = KINDS[k], dash = K.dash ? ` stroke-dasharray="${K.dash.split(" ").map(v => r2(v * 6 * f)).join(" ")}"` : "";
    return `<line x1="${r2(sx)}" y1="${r2(sy - 1 * f)}" x2="${r2(sx + 28 * f)}" y2="${r2(sy - 1 * f)}" stroke="${T.kind(k)}" stroke-width="${r2(K.w * 7 * f)}" stroke-linecap="round"${dash}/>`;
  };
  const runFt = c => Math.round(polyLen(connPts(c)));
  const kindFt = k => Math.round(conns.filter(c => c.kind === k).reduce((a, c) => a + polyLen(connPts(c)), 0));

  let y = M, body = "";
  if (e.header) { const h = drawHeader(e, W, f, M, "Equipment breakdown, page 2 of 2"); body += h.m; y = h.y; }
  else { body += svgText(M, y + 50 * f, "Equipment breakdown", 52 * f, { bold: true }); y += 90 * f; }

  // Summary strip
  const stats = [[String(items.length), items.length === 1 ? "Piece of equipment" : "Pieces of equipment"]];
  GROUPS.filter(([g]) => !["text", "team", "custom"].includes(g)).forEach(([g, label, types]) => {
    const n = items.filter(i => types.includes(i.type)).length;
    if (n) stats.push([String(n), { heat: "Heat units", cooling: "Cooling and power", gas: "Gas banks and fittings", seating: n === 1 ? "Bench" : "Benches" }[g]]);
  });
  kindsUsed.forEach(k => {
    const cs = conns.filter(c => c.kind === k);
    stats.push([`~${kindFt(k)} ft`, `${KINDS[k].name}, ${cs.length} run${cs.length > 1 ? "s" : ""}`]);
  });
  const cellW = inner / Math.max(4, stats.length);
  stats.forEach(([v, l], i) => {
    const x = M + i * cellW;
    if (i) body += `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(1.5 * f)}" height="${r2(96 * f)}" fill="${P_RULE}"/>`;
    const px = x + (i ? 28 * f : 0);
    body += svgText(px, y + 52 * f, v, 50 * f, { bold: true });
    body += svgText(px, y + 86 * f, l, 21 * f, { fill: P_MUTED });
  });
  y += 140 * f;

  const section = (title, sub) => {
    body += svgText(M, y + 32 * f, title, 32 * f, { bold: true });
    if (sub) body += svgText(W - M, y + 32 * f, sub, 21 * f, { fill: P_MUTED, anchor: "end" });
    y += 54 * f;
  };

  // Load list
  section("Load list", "What goes on the truck");
  const byType = order.filter(t => items.some(i => i.type === t)).map(t => {
    const its = items.filter(i => i.type === t), sizes = [...new Set(its.map(sizeOf))];
    return { t, n: its.length, sizes: sizes.join(", ") };
  });
  const loadRows = byType.map(r => ({ swatch: swatchFor(r.t), cells: [TYPES[r.t].name, GROUPS.find(([, , ts]) => ts.includes(r.t))[1], r.sizes, String(r.n)] }));
  kindsUsed.forEach(k => {
    const cs = conns.filter(c => c.kind === k), marked = cs.map(c => c.label).filter(Boolean);
    const tally = {}; marked.forEach(m => (tally[m] = (tally[m] || 0) + 1));
    const desc = Object.entries(tally).map(([m, n]) => `${n} × ${m}`).join(", ");
    loadRows.push({ swatch: kindSwatch(k), cells: [KINDS[k].name, "Hoses and cords", desc || `~${kindFt(k)} ft on the map`, String(cs.length)] });
  });
  const lt = drawTable(M, y, inner, [
    { label: "Item", w: 3, bold: true }, { label: "Category", w: 2 }, { label: "Sizes on the plan", w: 4, muted: true }, { label: "Qty", w: 1, align: "right", bold: true }
  ], loadRows, f);
  body += lt.m; y += lt.h + 56 * f;

  // Placement detail
  section("Placement", view === "both" ? "Positions on both sidelines" : `Positions on the ${viewName(view)}`);
  const linksOf = it => conns.filter(c => c.from === it.id || c.to === it.id).map(c => {
    const other = byId(c.from === it.id ? c.to : c.from);
    return `${KINDS[c.kind].name.toLowerCase()} ${c.from === it.id ? "to" : "from"} ${other.label || TYPES[other.type].name}`;
  }).join("; ");
  const showSide = view === "both";
  const pCols = [{ label: "Label", w: 2.4, bold: true }, { label: "Type", w: 2.2 }, { label: "Size", w: 1.5 }];
  if (showSide) pCols.push({ label: "Sideline", w: 1.9 });
  pCols.push({ label: "Yard line", w: 2 }, { label: "Back from sideline", w: 1.5 }, { label: "Connections", w: 3.2, muted: true }, { label: "Notes", w: 3.6, muted: true });
  const pRows = items.map(it => {
    const s = sidelineOf(it), cells = [it.label || TYPES[it.type].name, TYPES[it.type].name, sizeOf(it)];
    if (showSide) cells.push(s.side);
    cells.push(ydShort(it.x), s.back == null ? "" : `${s.back} ft`, linksOf(it), (it.notes || "").trim());
    return { swatch: swatchFor(it.type), cells };
  });
  const pt = drawTable(M, y, inner, pCols, pRows, f);
  body += pt.m; y += pt.h + 56 * f;

  // Hose and cord runs
  if (conns.length) {
    section("Hose and cord runs", "Lengths are measured on the plan; confirm on site");
    const ordered = kindsUsed.flatMap(k => conns.filter(c => c.kind === k));
    const rRows = ordered.map(c => {
      const a = byId(c.from), b = byId(c.to);
      return { swatch: kindSwatch(c.kind), cells: [KINDS[c.kind].name, a.label || TYPES[a.type].name, b.label || TYPES[b.type].name, c.label || "", `~${runFt(c)} ft`, (c.notes || "").trim()] };
    });
    const rt = drawTable(M, y, inner, [
      { label: "Type", w: 2.2, bold: true }, { label: "From", w: 2 }, { label: "To", w: 2 }, { label: "Marked as", w: 1.6 }, { label: "On the plan", w: 1.4, align: "right" }, { label: "Notes / parts", w: 5.2, muted: true }
    ], rRows, f);
    body += rt.m; y += rt.h;
  }

  if (e.footer) { const ft = drawFooter(e, W, f, M, y, "Quantities reflect what is shown on the site plan. Lengths are approximate."); body += ft.m; y = ft.y; }
  const H = Math.round(y + M);
  return { W, H, svg: wrapSvg(W, H, body) };
}

// ---------- Logo ----------
function readLogo(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("read"));
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth || 600, h = img.naturalHeight || 240;
        const k = Math.min(1, 900 / w, 360 / h); w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        let url = cv.toDataURL("image/png");
        if (url.length > 350000) url = cv.toDataURL("image/webp", 0.9);
        res({ url, w, h });
      };
      img.onerror = () => rej(new Error("decode"));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function toCanvas(page) {
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(page.svg);
  await img.decode();
  const cv = document.createElement("canvas"); cv.width = page.W; cv.height = page.H;
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, page.W, page.H); ctx.drawImage(img, 0, 0, page.W, page.H);
  return cv;
}
const toBlob = (cv, type, q) => new Promise((res, rej) => cv.toBlob(b => (b ? res(b) : rej(new Error("blob"))), type, q));
let jspdfP = null;
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  if (!jspdfP) jspdfP = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    sc.onload = () => (window.jspdf ? res(window.jspdf) : rej(new Error("jspdf")));
    sc.onerror = () => { jspdfP = null; rej(new Error("jspdf")); };
    document.head.appendChild(sc);
  });
  return jspdfP;
}
async function makePdf(canvases) {
  const { jsPDF } = await loadJsPDF();
  let doc = null;
  canvases.forEach(cv => {
    const portrait = cv.height / cv.width > 0.95, orient = portrait ? "portrait" : "landscape";
    if (!doc) doc = new jsPDF({ orientation: orient, unit: "pt", format: "letter" });
    else doc.addPage("letter", orient);
    const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight(), mg = 18;
    const k = Math.min((pw - 2 * mg) / cv.width, (ph - 2 * mg) / cv.height), w = cv.width * k, h = cv.height * k;
    doc.addImage(cv.toDataURL("image/jpeg", 0.92), "JPEG", (pw - w) / 2, mg, w, h, undefined, "FAST");
  });
  return doc.output("blob");
}
async function offer(fname, blob) {
  if (!downloadsCap) downloadsCap = await getCap("downloads");
  if (!downloadsCap) return "none";
  try { await downloadsCap.save({ filename: fname, data: blob }); return "saved"; }
  catch (err) { return err && err.code === "declined" ? "declined" : "failed"; }
}
async function exportImage() {
  const e = state.settings.exp, W = resW(e), two = pageCount(e) > 1;
  const btn = $("#exp-go"), label = btn.textContent; btn.disabled = true; btn.textContent = "Exporting…";
  const base = (((e.client || "").trim() || state.name || "sideline-layout").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-")) || "sideline-layout";
  try {
    const pages = [buildExport(e, W)]; if (two) pages.push(buildBreakdown(e, W));
    const canvases = [];
    for (const p of pages) canvases.push(await toCanvas(p));

      result = await offer(base + ".png", await toBlob(canvases[0], "image/png"));
      if (two && result === "saved") result = await offer(base + "-equipment.png", await toBlob(canvases[1], "image/png"));
    } else {
      let pdf = null;
      try { pdf = await makePdf(canvases); } catch { toast("PDF tools didn't load. Switch File to PNG and try again."); }
      result = pdf ? await offer(base + ".pdf", pdf) : "failed-quiet";

      const o2 = $("#img-out2");
      if (two) { o2.src = URL.createObjectURL(await toBlob(canvases[1], "image/png")); o2.hidden = false; } else o2.hidden = true;
      $("#img-overlay").hidden = false;
    } else if (result === "failed") toast("The download didn't go through. Try again.");
  } catch (err) {

  }
  btn.disabled = false; btn.textContent = label;
}
